<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercice 5 — QR code + marqueur Hiro</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
  <!-- Cette page EST la cible du QR code.
       Scénario : QR scanné -> ouvre cette page -> on repointe la caméra sur le
       même carton (QR avec le Hiro en son centre) -> la boîte AR apparaît. -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true">

    <a-marker preset="hiro">
      <a-box
        position="0 0.5 0"
        material="color: #457b9d; opacity: 0.85; transparent: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
