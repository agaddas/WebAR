<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercice 3 — Interaction clic / tap</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <style> body { margin: 0; overflow: hidden; } </style>

  <script>
    // Composant maison : à chaque clic/tap on change la couleur ET on booste l'animation.
    AFRAME.registerComponent('tap-interaction', {
      init: function () {
        var colors = ['#e63946', '#2a9d8f', '#457b9d', '#f4a261', '#e9c46a'];
        var index = 0;
        var boosted = false;
        var el = this.el;

        el.addEventListener('click', function () {
          // 1) Couleur suivante
          index = (index + 1) % colors.length;
          el.setAttribute('material', 'color', colors[index]);

          // 2) Animation supplémentaire : on alterne rotation rapide + agrandissement
          boosted = !boosted;
          el.setAttribute('animation', 'dur', boosted ? 900 : 4000);   // tourne plus vite
          el.setAttribute('scale', boosted ? '1.4 1.4 1.4' : '1 1 1'); // change d'échelle
        });
      }
    });
  </script>
</head>
<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true">

    <a-marker preset="hiro">
      <!-- class="clickable" : cible du raycaster.  tap-interaction : notre composant. -->
      <a-box
        class="clickable"
        tap-interaction
        position="0 0.5 0"
        material="color: #2a9d8f; opacity: 0.5; transparent: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <!-- Caméra + curseur.
         rayOrigin: mouse  => fonctionne à la souris (desktop) ET au toucher (mobile).
         raycaster n'écoute que les objets .clickable. -->
    <a-entity camera>
      <a-entity cursor="rayOrigin: mouse; fuse: false"
                raycaster="objects: .clickable"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
