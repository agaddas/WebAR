<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de QR code — Exercice 5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto;
           padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    input { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 12px; padding: 10px 18px; font-size: 1rem; cursor: pointer;
             border: none; border-radius: 8px; background: #0f766e; color: #fff; }
    #qr { margin-top: 24px; display: flex; justify-content: center; }
    p.hint { color: #555; font-size: .9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Générer le QR code du projet</h1>
  <p class="hint">Collez l'URL GitHub Pages de votre <code>exercice5.html</code>
     (ex. <code>https://votre-pseudo.github.io/votre-repo/exercice5.html</code>),
     générez le QR, imprimez-le, puis collez le marqueur Hiro en son centre.</p>

  <input id="url" type="text" placeholder="https://votre-pseudo.github.io/votre-repo/exercice5.html">
  <button onclick="generate()">Générer</button>

  <div id="qr"></div>

  <script>
    function generate() {
      var box = document.getElementById('qr');
      box.innerHTML = '';
      var url = document.getElementById('url').value.trim();
      if (!url) { box.textContent = 'Entrez une URL.'; return; }
      new QRCode(box, { text: url, width: 300, height: 300,
                        correctLevel: QRCode.CorrectLevel.H }); // H = tolère le Hiro au centre
    }
  </script>
</body>
</html>
